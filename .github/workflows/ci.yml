name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy
      - run: python -m pytest --cov=measurement_harness --cov-report=term-missing --cov-fail-under=90
      # The demo runs on the synthetic path, so CI exercises the whole pipeline
      # without an instrument. It is a smoke test, not a measurement.
      - run: make demo
